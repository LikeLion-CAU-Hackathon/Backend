# 워크플로우의 이름
name: Spring Boot CI with Gradle

# 워크플로우가 실행될 시점(이벤트)을 정의
on:
  # main, develop 브랜치로 push 이벤트가 발생했을 때
  push:
    branches: [ "main", "develop" ]
  # main, develop 브랜치로 pull_request 이벤트가 발생했을 때 (merge 전 검증)
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 'build'라는 이름의 Job 정의
  build:
    # 이 Job을 실행할 가상 머신 환경 (Ubuntu 최신 버전)
    runs-on: ubuntu-latest

    # Job 내부에서 실행될 단계(Step)들
    steps:
      # 1. 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 캐시 설정
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Gradle로 빌드 및 테스트
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test report
        if: always()  # 실패해도 업로드
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
      
      - name: Upload JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
      
      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # JAR 파일명 찾기
          JAR_FILE=$(ls *.jar | head -n 1)
          
          # EC2로 JAR 파일 전송
          scp -i private_key.pem -o StrictHostKeyChecking=no $JAR_FILE ${USER}@${HOST}:/home/${USER}/app/application.jar
          
          # EC2에서 애플리케이션 재시작
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${USER}@${HOST} << 'EOF'
            sudo systemctl restart myapp
            sudo systemctl status myapp
          EOF
          
          rm -f private_key.pem


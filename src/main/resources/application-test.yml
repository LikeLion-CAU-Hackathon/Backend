spring:
  datasource:
    url: jdbc:h2:mem:santa
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 후 테이블 정리
    properties:
      hibernate:
        format_sql: true
        # Hibernate 6은 대부분 URL로 자동 감지되지만 명시해도 OK
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never             # schema.sql/data.sql 자동 실행 안 함(필요하면 always)
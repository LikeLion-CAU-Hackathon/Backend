spring:
  config:
    import: optional:classpath:application-jwt.yml
  datasource:
    url: jdbc:mysql://santa-db.crgcm8c448r8.ap-northeast-2.rds.amazonaws.com:3306/santa_prod?serverTimezone=Asia/Seoul&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: santa_prod
    password: ${RDS_PW}   # 환경변수로 주입
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 절대 create/update 쓰지 않음
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.web: warn
